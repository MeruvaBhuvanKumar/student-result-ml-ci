      - name: Verify ML output files
        run: |
          test -f student_result_model.pkl
          test -f metrics.json
          test -f student_results.csv

      - name: Upload validated ML artifacts
        uses: actions/upload-artifact@v7
        with:
          name: student-result-ml-artifacts
          path: |
            student_result_model.pkl
            metrics.json
            student_results.csv
          if-no-files-found: error
          retention-days: 7
